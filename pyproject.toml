[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Derive the version from git: a clean tag (e.g. v1.4.0) -> "1.4.0";
# commits past the tag -> "<next>.dev<N>+g<hash>". Used when git metadata
# is unavailable (e.g. a source copy without .git).
fallback_version = "0.0.0"
